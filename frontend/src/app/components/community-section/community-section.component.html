<section class="community-hero">

  <!-- Arc of Static Image Tiles -->
  <div class="image-arc">
    <div class="tile tile-1"><img [src]="communityImages[0]" alt="Community" /></div>
    <div class="tile tile-2"><img [src]="communityImages[1]" alt="Community" /></div>
    <div class="tile tile-3"><img [src]="communityImages[2]" alt="Community" /></div>
    <div class="tile tile-4"><img [src]="communityImages[3]" alt="Community" /></div>
    <div class="tile tile-5"><img [src]="communityImages[4]" alt="Community" /></div>
    <div class="tile tile-6"><img [src]="communityImages[5]" alt="Community" /></div>
    <div class="tile tile-7"><img [src]="communityImages[6]" alt="Community" /></div>
    <div class="tile tile-8"><img [src]="communityImages[7]" alt="Community" /></div>
    <div class="tile tile-9"><img [src]="communityImages[8]" alt="Community" /></div>
  </div>

  <!-- Headline -->
  <h1 class="hero-title">
    <span class="title-line-1">THE BRIMA</span>
    <span class="title-line-2">COMMUNITY</span>
  </h1>

  <!-- Subtitle -->
  <p class="hero-subtitle">
    Where creators meet, collaborate, and move forward together
  </p>

  <!-- CTA Button -->
  <a [routerLink]="siteConfig.externalUrls.creatorSignUp" class="cta-button">
    Join the Movement
  </a>

</section>
